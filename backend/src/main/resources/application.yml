spring:
  application:
    name: rentmanager-backend

  datasource:
    # Reuse the same PostgreSQL database the Next.js/Prisma app uses.
    # DATABASE_URL is a JDBC URL, e.g. jdbc:postgresql://localhost:5432/rentmanager
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rentmanager}
    username: ${DB_USER:rentmanager}
    password: ${DB_PASSWORD:rentmanager}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    hibernate:
      # Prisma owns the base schema; JPA never mutates it. Flyway handles
      # additive migrations (tenant_id, indexes).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Adopt the existing Prisma schema as the baseline instead of recreating it.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # Behind the Next.js proxy / a TLS terminator.
  forward-headers-strategy: framework

rentmanager:
  auth:
    session-cookie: rm_session
    session-ttl-days: ${SESSION_TTL_DAYS:30}
    # Must match the Next app's cookie behavior.
    cookie-secure: ${COOKIE_SECURE:false}
    challenge-secret: ${AUTH_CHALLENGE_SECRET:${SETTINGS_ENC_KEY:dev-settings-enc-key-change-me-32b-min}}
  security:
    settings-enc-key: ${SETTINGS_ENC_KEY:dev-settings-enc-key-change-me-32b-min}
  tenancy:
    default-tenant: DEFAULT
  payments:
    # M13 QR: shared secret for the signed payment webhook + member-QR HMAC
    # tokens. A DB-sealed m28.providers.paymentCredentials overrides this at
    # runtime; both stacks must agree (mirrors PAYMENT_WEBHOOK_SECRET).
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret-change-me}
    # Absolute base URL encoded in member pay QRs (scan targets must be
    # absolute). Mirrors APP_BASE_URL in the Next app.
    app-base-url: ${APP_BASE_URL:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG:warn}
