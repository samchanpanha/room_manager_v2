server:
  port: 8081

spring:
  application:
    name: identity-service

  config:
    import:
      - optional:nacos:shared-common.yml

  # ── Redis Connection ──────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rentmanager-redis-secret}
      timeout: 2000ms

  # ── Nacos ──────────────────────────────────────────────────────────────────
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        import-check:
          enabled: false
        shared-configs:
          - data-id: shared-common.yml
            refresh: true
        extension-configs:
          - data-id: services.yml
            refresh: true

  # ── Database (Prisma-owned schema) ────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentmanager}
    username: ${DB_USER:rentmanager}
    password: ${DB_PASSWORD:rentmanager}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        globally_quoted_identifiers: true   # required: Prisma uses PascalCase "TableName"
  flyway:
    enabled: false   # Prisma owns migrations

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  # ── Security (accepts both session-cookie and JWT from Gateway) ───────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:7080/realms/rentmanager}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:7080/realms/rentmanager/protocol/openid-connect/certs}

# ── Outbox relay ─────────────────────────────────────────────────────────────
rm:
  outbox:
    poll-interval-ms: 5000
    batch-size: 50

# ── Scheduling (needed for @Scheduled in OutboxRelay) ──────────────────────
scheduling:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.rentmanager: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
